    children:
    - name: AcquisitionStart
      label: null
      description: ''
      write_pv: $(P)$(R)AcquisitionStart
      write_widget:
        lines: null
        format: null
        precision: null
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionStart_RBV
      read_widget:
        lines: null
        format: null
        precision: null
        type: TextRead
      type: SignalRW
    - name: AcquisitionStop
      label: null
      description: Stop acquisition. Acquisition will stop after acquisition of the
        current frame is complete.
      write_pv: $(P)$(R)AcquisitionStop
      write_widget:
        lines: null
        format: null
        precision: null
        type: TextWrite
      type: SignalW
    - name: AcquisitionAbort
      label: null
      description: Abort acquisition. Acquisition will stop immediately, but a partially
        transferred image will be completed.
      write_pv: $(P)$(R)AcquisitionAbort
      write_widget:
        lines: null
        format: null
        precision: null
        type: TextWrite
      type: SignalW
    - name: AcquisitionMode
      label: null
      description: 'The acquisition mode determines the behavior of the camera when
        acquisition start is triggered. "Continuous" mode: the camera will acquire
        images until acquisition stop is triggered. "SingleFrame" mode: the camera
        will acquire a single image. "MultiFrame" mode: the camera will acquire the
        number of images specified by AcquisitionFrameCount. "Recorder" mode: the
        camera will run continuously, and when the recorder event is triggered, send
        pre-trigger and post-trigger images to the host.'
      write_pv: $(P)$(R)AcquisitionMode
      write_widget:
        choices:
        - Continuous
        - SingleFrame
        - MultiFrame
        - Recorder
        type: ComboBox
      read_pv: $(P)$(R)AcquisitionMode_RBV
      read_widget:
        lines: null
        format: null
        precision: null
        type: TextRead
      type: SignalRW
    - name: AcquisitionFrameCount
      label: null
      description: This is the number of images to acquire when in MultiFrame and
        Recorder acquisition modes.
      write_pv: $(P)$(R)AcquisitionFrameCount
      write_widget:
        lines: null
        format: null
        precision: null
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionFrameCount_RBV
      read_widget:
        lines: null
        format: null
        precision: null
        type: TextRead
      type: SignalRW
    - name: AcquisitionFrameRateAbs
      label: null
      description: Frame rate, in frames per second. This is applicable when either
        the FrameStart trigger mode is disabled, or the FrameStart trigger source
        is FixedRate. Depending on the exposure duration, the camera may not achieve
        the frame rate set here.
      write_pv: $(P)$(R)AcquisitionFrameRateAbs
      write_widget:
        lines: null
        format: null
        precision: null
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionFrameRateAbs_RBV
      read_widget:
        lines: null
        format: null
        precision: null
        type: TextRead
      type: SignalRW
