type: Device
label: NewInstance
parent: NewInstanceClassPVIYamlCreatedWithMakePvi
children:
- type: Group
  name: NewInstanceClassPVIYamlCreatedWithMakePvi
  layout:
    type: Grid
    labelled: true
  children:
  - type: Group
    name: Acquisition
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: AcquisitionStart
      write_pv: $(P)$(R)AcquisitionStart
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionStart_RBV
      read_widget:
        type: TextRead
    - type: SignalX
      name: AcquisitionStop
      description: Stop acquisition. Acquisition will stop after acquisition of the
        current frame is complete.
      write_pv: $(P)$(R)AcquisitionStop
      write_widget:
        type: ButtonPanel
        actions:
          Go: '1'
      value: '1'
    - type: SignalX
      name: AcquisitionAbort
      description: Abort acquisition. Acquisition will stop immediately, but a partially
        transferred image will be completed.
      write_pv: $(P)$(R)AcquisitionAbort
      write_widget:
        type: ButtonPanel
        actions:
          Go: '1'
      value: '1'
    - type: SignalRW
      name: AcquisitionMode
      description: 'The acquisition mode determines the behavior of the camera when
        acquisition start is triggered. "Continuous" mode: the camera will acquire
        images until acquisition stop is triggered. "SingleFrame" mode: the camera
        will acquire a single image. "MultiFrame" mode: the camera will acquire the
        number of images specified by AcquisitionFrameCount. "Recorder" mode: the
        camera will run continuously, and when the recorder event is triggered, send
        pre-trigger and post-trigger images to the host.'
      write_pv: $(P)$(R)AcquisitionMode
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)AcquisitionMode_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: AcquisitionFrameCount
      description: This is the number of images to acquire when in MultiFrame and
        Recorder acquisition modes.
      write_pv: $(P)$(R)AcquisitionFrameCount
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionFrameCount_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: AcquisitionFrameRateAbs
      description: Frame rate, in frames per second. This is applicable when either
        the FrameStart trigger mode is disabled, or the FrameStart trigger source
        is FixedRate. Depending on the exposure duration, the camera may not achieve
        the frame rate set here.
      write_pv: $(P)$(R)AcquisitionFrameRateAbs
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionFrameRateAbs_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: AcquisitionFrameRateLimit
      description: This is the maximum frame rate possible for the current exposure
        duration and image format.
      write_pv: $(P)$(R)AcquisitionFrameRateLimit
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)AcquisitionFrameRateLimit_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: RecorderPreEventCount
      description: This is the number of pre-event images to acquire in the Recorder
        acquisition mode. This must be less than or equal to AcquisitionFrameCount.
      write_pv: $(P)$(R)RecorderPreEventCount
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)RecorderPreEventCount_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: BalanceWhiteAutoControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: BalanceWhiteAutoRate
      description: Rate of white balance adjustments, from 1 (slowest) to 100 (fastest).
        Use this control to slow down the auto-whitebalance adjustments.
      write_pv: $(P)$(R)BalanceWhiteAutoRate
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)BalanceWhiteAutoRate_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BalanceWhiteAutoAdjustTol
      description: Tolerance, in percent, allowed from the ideal whitebalance values,
        within which the auto-whitebalance does not run. This prevents needless small
        adjustments from occurring each image.
      write_pv: $(P)$(R)BalanceWhiteAutoAdjustTol
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)BalanceWhiteAutoAdjustTol_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: BlackLevelControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: BlackLevelSelector
      description: Selects which Black Level is controlled by the various Black Level
        features.
      write_pv: $(P)$(R)BlackLevelSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)BlackLevelSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BlackLevel
      description: Black level (offset) value.
      write_pv: $(P)$(R)BlackLevel
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)BlackLevel_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: ColorTransformationControl
    description: Category that contains the Color Transformation control features.
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: ColorTransformationSelector
      description: Selects which Color Transformation module is controlled by the
        various Color Transformation features.
      write_pv: $(P)$(R)ColorTransformationSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ColorTransformationSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ColorTransformationMode
      description: Selects the mode for the color transformation.
      write_pv: $(P)$(R)ColorTransformationMode
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ColorTransformationMode_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ColorTransformationValueSelector
      description: Selects the Gain factor or Offset of the Transformation matrix
        to access in the selected Color Transformation module.
      write_pv: $(P)$(R)ColorTransformationValueSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ColorTransformationValueSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ColorTransformationValue
      description: Represents the value of the selected Gain factor or Offset inside
        the Transformation matrix.
      write_pv: $(P)$(R)ColorTransformationValue
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ColorTransformationValue_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Controls
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: Gamma
      description: Applies gamma value to the raw sensor signal.
      write_pv: $(P)$(R)Gamma
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)Gamma_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: DefectMaskEnable
      description: Enable masking of defective pixel clusters. Defective pixels are
        detected and recorded at the factory.
      write_pv: $(P)$(R)DefectMaskEnable
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DefectMaskEnable_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: Hue
      description: Hue turns the color vectors in the U/V plane. It is 1 degree per
        step.
      write_pv: $(P)$(R)Hue
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)Hue_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: Saturation
      description: Saturation puts gain to the color vectors in the U/V plane.
      write_pv: $(P)$(R)Saturation
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)Saturation_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: DSPSubregion
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: DSPSubregionLeft
      description: The DSP subregion is the area of the image used for measurements
        in "auto-" functions such as auto-exposure and auto-gain. DSPSubregionLeft
        is the left column, relative to the current image region.
      write_pv: $(P)$(R)DSPSubregionLeft
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DSPSubregionLeft_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: DSPSubregionTop
      description: The DSP subregion is the area of the image used for measurements
        in "auto-" functions such as auto-exposure and auto-gain. DSPSubregionTop
        is the top row, relative to the current image region.
      write_pv: $(P)$(R)DSPSubregionTop
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DSPSubregionTop_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: DSPSubregionRight
      description: The DSP subregion is the area of the image used for measurements
        in "auto-" functions such as auto-exposure and auto-gain. DSPSubregionRight
        is the right column, relative to the current image region. For convenience,
        this value may be higher than the maximum Width.
      write_pv: $(P)$(R)DSPSubregionRight
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DSPSubregionRight_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: DSPSubregionBottom
      description: The DSP subregion is the area of the image used for measurements
        in "auto-" functions such as auto-exposure and auto-gain. DSPSubregionBottom
        is the bottom row, relative to the current image region. For convenience,
        this value may be higher than the maximum Height.
      write_pv: $(P)$(R)DSPSubregionBottom
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DSPSubregionBottom_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: DefectMask
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: DefectMaskColumnEnable
      description: Enable masking of defective columns. Defective columns are detected
        and recorded at the factory.
      write_pv: $(P)$(R)DefectMaskColumnEnable
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)DefectMaskColumnEnable_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: DeviceStatus
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: DeviceTemperatureSelector
      write_pv: $(P)$(R)DeviceTemperatureSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)DeviceTemperatureSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: DeviceTemperature
      write_pv: $(P)$(R)DeviceTemperature
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)DeviceTemperature_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: EventControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: EventSelector
      description: Activate event-notification on the GigE Vision message channel.
      write_pv: $(P)$(R)EventSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)EventSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventNotification
      description: Activate event-notification on the GigE Vision message channel.
      write_pv: $(P)$(R)EventNotification
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)EventNotification_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventsEnable1
      description: Activate event-notification on the GigE Vision message channel.
        For programmers. See register documentation.
      write_pv: $(P)$(R)EventsEnable1
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventsEnable1_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: EventID
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: EventAcquisitionStart
      description: ID value of event.
      write_pv: $(P)$(R)EventAcquisitionStart
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventAcquisitionStart_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventAcquisitionEnd
      description: ID value of event.
      write_pv: $(P)$(R)EventAcquisitionEnd
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventAcquisitionEnd_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventFrameTrigger
      description: ID value of event.
      write_pv: $(P)$(R)EventFrameTrigger
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventFrameTrigger_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventExposureEnd
      description: ID value of event.
      write_pv: $(P)$(R)EventExposureEnd
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventExposureEnd_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventAcquisitionRecordTrigger
      description: ID value of event.
      write_pv: $(P)$(R)EventAcquisitionRecordTrigger
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventAcquisitionRecordTrigger_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventLine1RisingEdge
      description: ID value of event.
      write_pv: $(P)$(R)EventLine1RisingEdge
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventLine1RisingEdge_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventLine1FallingEdge
      description: ID value of event.
      write_pv: $(P)$(R)EventLine1FallingEdge
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventLine1FallingEdge_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventLine2RisingEdge
      description: ID value of event.
      write_pv: $(P)$(R)EventLine2RisingEdge
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventLine2RisingEdge_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventLine2FallingEdge
      description: ID value of event.
      write_pv: $(P)$(R)EventLine2FallingEdge
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventLine2FallingEdge_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventFrameTriggerReady
      description: ID value of Frame Trigger Ready event. The Frame Trigger event
        occurs when the camera is ready for another frame aquisition
      write_pv: $(P)$(R)EventFrameTriggerReady
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventFrameTriggerReady_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventExposureStart
      write_pv: $(P)$(R)EventExposureStart
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventExposureStart_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventOverflow
      description: ID value of overflow event. The overflow event occurs when one
        or more notification events are lost on the camera. If you use the message
        channel for event notification, you are always subscribed to this event.
      write_pv: $(P)$(R)EventOverflow
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventOverflow_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: EventError
      description: ID value of error event. The error event occurs if there is a problem
        on the camera; this event should be reported to technical support. If you
        use the message channel for event notification, you are always subscribed
        to this event.
      write_pv: $(P)$(R)EventError
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)EventError_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Exposure
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: ExposureAuto
      description: 'Method used to set exposure duration, ExposureTimeAbs in Timed
        mode. Off: automatic mode is off. Once: auto-exposure occurs until target
        is achieved, then ExposureAuto returns to Off. Continuous: auto-exposure always
        runs.'
      write_pv: $(P)$(R)ExposureAuto
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ExposureAuto_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureMode
      description: 'Method of control for exposure duration. Timed: exposure duration
        is set by ExposureTimeAbs. TriggerWidth: exposure controlled by external trigger
        pulse.'
      write_pv: $(P)$(R)ExposureMode
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ExposureMode_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureTimeAbs
      description: 'Exposure duration in microseconds. Timed: Sensor integration time.
        TriggerWidth: Ignored.'
      write_pv: $(P)$(R)ExposureTimeAbs
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureTimeAbs_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureTimeIncrement
      description: Increment of the exposure time in microseconds.
      write_pv: $(P)$(R)ExposureTimeIncrement
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureTimeIncrement_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: ExposureAutoControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: ExposureAutoTarget
      description: When ExposureAutoAlg is Mean, this is the target image mean value,
        in percent. Higher values result in brighter images.
      write_pv: $(P)$(R)ExposureAutoTarget
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoTarget_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoAlg
      description: 'Algorithm used for auto-exposure. Mean: target a particular mean
        value of all measured pixels in the image. FitRange: adjust the maximum pixel
        value to fit the sensor range.'
      write_pv: $(P)$(R)ExposureAutoAlg
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)ExposureAutoAlg_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoMin
      description: Minimum auto-exposure value, in microseconds.
      write_pv: $(P)$(R)ExposureAutoMin
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoMin_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoMax
      description: Maximum auto-exposure value, in microseconds.
      write_pv: $(P)$(R)ExposureAutoMax
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoMax_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoRate
      description: Rate of exposure adjustments, from 1 (slowest) to 100 (fastest).
        Use this control to slow down the auto-exposure adjustments.
      write_pv: $(P)$(R)ExposureAutoRate
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoRate_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoOutliers
      description: Number of upper outliers to discard before calculating exposure
        adjustments. This is in ten-thousandths of the number pixels in the image.
      write_pv: $(P)$(R)ExposureAutoOutliers
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoOutliers_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ExposureAutoAdjustTol
      description: Tolerance, in percent, allowed from the ideal exposure value, within
        which the auto-exposure does not run. This prevents needless small adjustments
        from occurring each image.
      write_pv: $(P)$(R)ExposureAutoAdjustTol
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ExposureAutoAdjustTol_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: GainAutoControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: GainAutoTarget
      description: This is the target image mean value, in percent.
      write_pv: $(P)$(R)GainAutoTarget
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoTarget_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAutoMin
      write_pv: $(P)$(R)GainAutoMin
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoMin_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAutoMax
      write_pv: $(P)$(R)GainAutoMax
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoMax_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAutoRate
      description: Rate of gain adjustments, from 1 (slowest) to 100 (fastest). Use
        this control to slow down the auto-gain adjustments.
      write_pv: $(P)$(R)GainAutoRate
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoRate_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAutoOutliers
      description: Number of upper outliers to discard before calculating gain adjustments.
        This is in ten-thousandths of the number pixels in the image.
      write_pv: $(P)$(R)GainAutoOutliers
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoOutliers_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAutoAdjustTol
      description: Tolerance, in percent, allowed from the ideal gain value, within
        which the auto-gain does not run. This prevents needless small adjustments
        from occurring each image.
      write_pv: $(P)$(R)GainAutoAdjustTol
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainAutoAdjustTol_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: GainControl
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: GainSelector
      description: (GenICam boilerplate. Always All.)
      write_pv: $(P)$(R)GainSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)GainSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: Gain
      description: Gain value of analog A/D stage. Units are usually in dB.
      write_pv: $(P)$(R)Gain
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)Gain_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainRaw
      description: Gain value of analog A/D stage. Units are usually in dB.
      write_pv: $(P)$(R)GainRaw
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GainRaw_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GainAuto
      description: 'Method used to set Gain. Off: automatic mode is off. Once: auto-gain
        occurs until target is achieved, then GainAuto returns to Off. Continuous:
        auto-gain always runs.'
      write_pv: $(P)$(R)GainAuto
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)GainAuto_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: GigE
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: StreamBytesPerSecond
      write_pv: $(P)$(R)StreamBytesPerSecond
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)StreamBytesPerSecond_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BandwidthControlMode
      description: Bandwidth allocation can be controlled by StreamBytesPerSecond,
        or by register SCPD0. If you do not understand SCPD0 and how this driver uses
        this register, leave this set to "StreamBytesPerSecond".
      write_pv: $(P)$(R)BandwidthControlMode
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)BandwidthControlMode_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: GevSCPSPacketSize
      write_pv: $(P)$(R)GevSCPSPacketSize
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GevSCPSPacketSize_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: ChunkModeActive
      write_pv: $(P)$(R)ChunkModeActive
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)ChunkModeActive_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: PayloadSize
      description: Maximum size of image block payload.
      write_pv: $(P)$(R)PayloadSize
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)PayloadSize_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
