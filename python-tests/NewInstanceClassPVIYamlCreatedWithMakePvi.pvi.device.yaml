      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)SyncInLevels_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: SyncInSelector
      description: Select the sync-in line to control with {SyncInGlitchFilter}.
      write_pv: $(P)$(R)SyncInSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)SyncInSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: SyncInGlitchFilter
      description: Glitch filter on sync-in line, in nanoseconds.
      write_pv: $(P)$(R)SyncInGlitchFilter
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)SyncInGlitchFilter_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: SyncOut
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: SyncOutLevels
      description: 'Output levels of hardware sync outputs, for output(s) in GPO mode.
        (Note: SyncOutPolarity can invert these values.)'
      write_pv: $(P)$(R)SyncOutLevels
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)SyncOutLevels_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: SyncOutSelector
      description: Select the sync-out line to control with {SyncOutSource, SyncOutPolarity}.
      write_pv: $(P)$(R)SyncOutSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)SyncOutSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: SyncOutSource
      description: 'Signal source of the sync-out line specified by SyncOutSelector.
        GPO: general purpose output. AcquisitionTriggerReady: acquisition trigger
        may occur. FrameTriggerReady: frame trigger may occur. Exposing: exposure
        in progress. FrameReadout: image readout in progress. Imaging: exposure or
        frame readout in progress. Acquiring: acquisition is running. LineIn: external
        line input. Strobe: source is strobe timing unit.'
      write_pv: $(P)$(R)SyncOutSource
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)SyncOutSource_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: SyncOutPolarity
      description: Polarity applied to the sync-out line specified by SyncOutSelector.
      write_pv: $(P)$(R)SyncOutPolarity
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)SyncOutPolarity_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Timestamp
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: GevTimestampTickFrequency
      description: Frequency of image timestamp, in Hertz.
      write_pv: $(P)$(R)GevTimestampTickFrequency
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GevTimestampTickFrequency_RBV
      read_widget:
        type: TextRead
    - type: SignalX
      name: GevTimestampControlLatch
      description: Capture timestamp and store in GevTimestampValue.
      write_pv: $(P)$(R)GevTimestampControlLatch
      write_widget:
        type: ButtonPanel
        actions:
          Go: '1'
      value: '1'
    - type: SignalX
      name: GevTimestampControlReset
      description: Reset the timestamp.
      write_pv: $(P)$(R)GevTimestampControlReset
      write_widget:
        type: ButtonPanel
        actions:
          Go: '1'
      value: '1'
    - type: SignalRW
      name: GevTimestampValue
      description: Value of timestamp, when latched by GevTimestampControlLatch.
      write_pv: $(P)$(R)GevTimestampValue
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)GevTimestampValue_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Trigger
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: TriggerSelector
      description: Select a trigger here, then use the controls {TriggerMode, TriggerSoftware,
        TriggerSource, TriggerActivation, TriggerOverlap, TriggerDelayAbs} to setup
        and read the trigger attributes. FrameStart is the trigger which starts each
        image (when acquisition is running). AcquisitionStart is the trigger which
        starts the acquisition process.
      write_pv: $(P)$(R)TriggerSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)TriggerSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: TriggerMode
      description: 'Enable or disable this trigger. Note: when the FrameStart trigger
        is disabled, images are triggered at a fixed rate specified by AcquisitionFrameRateAbs.'
      write_pv: $(P)$(R)TriggerMode
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)TriggerMode_RBV
      read_widget:
        type: TextRead
    - type: SignalX
      name: TriggerSoftware
      description: This software command effects a trigger.
      write_pv: $(P)$(R)TriggerSoftware
      write_widget:
        type: ButtonPanel
        actions:
          Go: '1'
      value: '1'
    - type: SignalRW
      name: TriggerSource
      description: Source of trigger, when TriggerMode is On. This might be an hardware
        trigger, a fixed rate generator, or software trigger only.
      write_pv: $(P)$(R)TriggerSource
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)TriggerSource_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: TriggerActivation
      description: Type of activation, for hardware triggers. This controls edge/level
        and polarity sensitivities.
      write_pv: $(P)$(R)TriggerActivation
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)TriggerActivation_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: TriggerOverlap
      description: Permitted window of trigger activation, relative to previous frame.
      write_pv: $(P)$(R)TriggerOverlap
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)TriggerOverlap_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: TriggerDelayAbs
      description: Delay from hardware trigger activation to trigger effect, in microseconds.
      write_pv: $(P)$(R)TriggerDelayAbs
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)TriggerDelayAbs_RBV
      read_widget:
        type: TextRead
  - type: Group
    name: Whitebalance
    layout:
      type: Grid
      labelled: true
    children:
    - type: SignalRW
      name: BalanceRatioSelector
      description: Select the Red or Blue channel to adjust with BalanceRatioAbs.
      write_pv: $(P)$(R)BalanceRatioSelector
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)BalanceRatioSelector_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BalanceRatioAbs
      description: Adjust the gain of the red or blue channel (see BalanceRatioSelector).
        The green channel gain is always 1.00.
      write_pv: $(P)$(R)BalanceRatioAbs
      write_widget:
        type: TextWrite
      read_pv: $(P)$(R)BalanceRatioAbs_RBV
      read_widget:
        type: TextRead
    - type: SignalRW
      name: BalanceWhiteAuto
      description: 'Method used to set White Balance values. Off: automatic mode is
        off. Once: auto-whitebalance occurs until target is achieved, then BalanceWhiteAuto
        returns to Off. Continuous: auto-whitebalance always runs.'
      write_pv: $(P)$(R)BalanceWhiteAuto
      write_widget:
        type: ComboBox
      read_pv: $(P)$(R)BalanceWhiteAuto_RBV
      read_widget:
        type: TextRead
